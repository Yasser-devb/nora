name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, zip
          coverage: none
      - name: Verify the Composer archive in an isolated consumer
        run: php .github/scripts/verify-package-archive.php

  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          # Disposable CI-only credentials; never use these outside this job.
          MYSQL_ROOT_PASSWORD: nora_ci_root_password
          MYSQL_DATABASE: nora_test
        ports:
          - 3306:3306
        volumes:
          - ${{ github.workspace }}/.github/mysql-init:/docker-entrypoint-initdb.d:ro
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=nora_ci_root_password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NORA_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=nora_test;charset=utf8mb4
      NORA_TEST_DB_NAME: nora_test
      NORA_TEST_DB_USERNAME: nora_test_user
      NORA_TEST_DB_PASSWORD: nora_ci_test_password
      NORA_REQUIRE_TEST_DB: '1'
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql
          coverage: none
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-${{ matrix.php }}-
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: composer audit
      - name: PHP syntax checks
        run: find src tests bin -type f \( -name '*.php' -o -path 'bin/nora' \) -print0 | xargs -0 -n1 php -l
      - run: composer test

  reactive-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npm audit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
